<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, #0f2e2a 0%, #134e4a 45%, #0d9488 100%);
    color: #f0fdfa; position: relative;
  }
  .pattern {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(240,253,250,0.08) 1px, transparent 0);
    background-size: 28px 28px;
  }
  .glow {
    position: absolute; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(45,212,191,0.25) 0%, transparent 65%);
    top: -220px; right: -160px;
  }
  .glow2 {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(13,148,136,0.35) 0%, transparent 65%);
    bottom: -200px; left: -120px;
  }
  .wrap { position: relative; padding: 90px 90px 0 90px; }
  .eyebrow {
    display: inline-block; letter-spacing: 4px; font-size: 20px; font-weight: 600;
    color: #5eead4; text-transform: uppercase; margin-bottom: 26px;
  }
  h1 { font-size: 108px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  h1 .accent { color: #5eead4; }
  .tagline { font-size: 34px; font-weight: 300; color: #ccfbf1; margin-top: 26px; }
  .chips { margin-top: 54px; display: flex; gap: 16px; }
  .chip {
    border: 1px solid rgba(94,234,212,0.45); border-radius: 999px;
    padding: 12px 26px; font-size: 21px; font-weight: 600; color: #ccfbf1;
    background: rgba(15,46,42,0.45);
  }
  .cross {
    position: absolute; right: 110px; top: 96px; width: 150px; height: 150px;
    opacity: 0.9;
  }
  .cross::before, .cross::after {
    content: ''; position: absolute; background: #5eead4; border-radius: 18px;
  }
  .cross::before { left: 55px; top: 0; width: 40px; height: 150px; }
  .cross::after { left: 0; top: 55px; width: 150px; height: 40px; }
  .footer {
    position: absolute; bottom: 64px; left: 90px; right: 90px;
    display: flex; justify-content: space-between; align-items: center;
    color: #99f6e4; font-size: 20px; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="pattern"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="wrap">
    <div class="eyebrow">Doctor Discovery &amp; Appointment Booking</div>
    <h1>Hakim<span class="accent">.</span></h1>
    <div class="tagline">Find the right doctor. Book in minutes.</div>
    <div class="chips">
      <span class="chip">React</span>
      <span class="chip">Node.js</span>
      <span class="chip">MongoDB</span>
      <span class="chip">Redis</span>
    </div>
  </div>
  <div class="cross"></div>
  <div class="footer">
    <span>hakim &middot; open source medical platform</span>
    <span>github.com/shok-ui/hakim</span>
  </div>
</body>
</html>
